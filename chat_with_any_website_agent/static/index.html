<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <title>Chat With Any Website Agent</title>
  <link rel="icon" href="/static/favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/theme.js"></script>
</head>
<body>
  <main>
    <header>
      <div class="header-top">
        <h1><img src="/static/favicon.svg?v=2" alt="" width="40" height="40">Chat With Any Website Agent</h1>
        <div id="theme-switch" class="theme-switch" role="group" aria-label="Color theme" hidden>
          <button type="button" class="secondary" data-choice="system" aria-pressed="true" aria-label="System theme" title="System: follow your device">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
          </button>
          <button type="button" class="secondary" data-choice="light" aria-pressed="false" aria-label="Light theme" title="Light">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button type="button" class="secondary" data-choice="dark" aria-pressed="false" aria-label="Dark theme" title="Dark">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
      </div>
      <p class="subtitle">Load a web page or PDF file, then ask questions about its content.</p>
    </header>

    <div class="load">
      <form id="ingest-form">
        <label for="url" class="sr-only">Web page address</label>
        <input id="url" type="text" inputmode="url" placeholder="Paste any web page or PDF address" required
               maxlength="2048" autocomplete="url" autocapitalize="off" spellcheck="false">
        <button id="ingest-button" type="submit">Load page</button>
      </form>
      <p id="status" class="status" role="status"></p>
    </div>

    <div id="page-bar" class="page-bar" hidden>
      <span class="page-bar-text">
        <span class="page-label">Chatting about</span>
        <a id="page-link" dir="auto" target="_blank" rel="noopener noreferrer"></a>
        <span id="page-meta" class="muted"></span>
      </span>
      <div class="page-actions">
        <button id="refresh-page" type="button" class="secondary" title="Fetch the page again for its latest version.">Refresh</button>
        <button id="forget-page" type="button" class="secondary" title="Delete the saved copy of this page">Delete data</button>
        <button id="new-chat" type="button" class="secondary">New chat</button>
      </div>
    </div>

    <section id="messages" role="log" aria-label="Conversation" aria-live="polite"></section>

    <form id="ask-form">
      <label for="question" class="sr-only">Your question</label>
      <input id="question" type="text" dir="auto" placeholder="Ask a question about the page" required maxlength="2000"
             autocomplete="off" disabled>
      <button id="ask-button" type="submit" disabled>Ask</button>
    </form>
  </main>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button id="confirm-cancel" type="submit" value="cancel" class="secondary" autofocus>Cancel</button>
        <button id="confirm-ok" type="submit" value="confirm" class="danger">Delete</button>
      </div>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>

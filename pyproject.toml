[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chat_with_any_website_agent"]

# The version is written once, in the package, and read from there.
[tool.hatch.version]
path = "chat_with_any_website_agent/__init__.py"

[project]
name = "chat-with-any-website-agent"
dynamic = ["version"]
description = "Agentic RAG built with LangGraph: grounded, cited answers about web pages and PDFs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aya Yousef" }]
keywords = ["rag", "agent", "langgraph", "retrieval", "citations", "pdf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.14"
# langgraph and langchain-core are added with `uv add langgraph langchain-core`, so that the latest versions are used.
dependencies = [
    "cohere>=7.2.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.10",
    "langgraph>=1.2.15",
    "pydantic-settings>=2.15.0",
    "pypdf[crypto]>=6.20.0",
    "trafilatura>=2.3.0",
    "weaviate-client>=4.23.1",
]

[project.urls]
Homepage = "https://github.com/ayayousef2000/chat-with-any-website-agent"
Repository = "https://github.com/ayayousef2000/chat-with-any-website-agent"
Issues = "https://github.com/ayayousef2000/chat-with-any-website-agent/issues"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # bugbear
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "S",       # security (bandit)
    "C4",      # comprehensions
    "SIM",     # simplifications
    "PT",      # pytest style
    "RUF",     # ruff-specific
    "D",       # docstrings
    "TC",      # imports only needed for type checking
    "PERF",    # performance anti-patterns
    "T20",     # no stray print statements
    "DTZ",     # timezone-aware datetimes
    "ASYNC",   # async code mistakes
]
ignore = [
    "D105",  # magic methods
    "D107",  # __init__ (documented on the class)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Pydantic and LangChain read annotations at run time, so their imports must stay real imports.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]
runtime-evaluated-decorators = ["langchain_core.tools.tool"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S104", "S105", "S106"]  # asserts, and placeholder keys in test data
"eval/**" = ["E402"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["chat_with_any_website_agent", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["chat_with_any_website_agent"]
branch = true

[tool.coverage.report]
fail_under = 80

[tool.poe.tasks]
types = "mypy"
lint = "ruff check ."
format = "ruff format --check ."
test = "pytest --cov --cov-report=term-missing:skip-covered"
fix = ["fix-lint", "fix-format"]
fix-lint = "ruff check --fix ."
fix-format = "ruff format ."
check = ["types", "lint", "format", "test"]
